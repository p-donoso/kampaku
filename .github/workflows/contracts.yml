name: Contracts

on:
  push:
    paths: ["packages/contracts/**", "apps/core/src/api/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["packages/contracts/**", "apps/core/src/api/**", ".github/workflows/contracts.yml"]

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
