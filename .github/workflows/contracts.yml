name: Contracts

on:
  push:
    paths: ["packages/contracts/**", "apps/core/src/api/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["packages/contracts/**", "apps/core/src/api/**", ".github/workflows/contracts.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run contracts:check
