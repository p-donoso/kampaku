name: Security

on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
